name: ci

on:
  push:
    branches: [dev]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test -- --run

      - name: Type check
        # A real gate. It reported 26 pre-existing errors until they were
        # cleared, which is why this could not be added before now -- a step
        # that is red on arrival teaches everyone to ignore it.
        run: npm run type-check

      - name: Production build
        # vite build is what actually ships: the deb packages the output of
        # this, not the sources. A build that fails here would otherwise only
        # be discovered while packaging.
        run: npx vite build --config vite.config.ts
